    <style>
      /* Absolute override for Netlify Toolbar & Drawer Shadow Elements */
      net-lify,
      netlify-drawer,
      netlify-feedback-button,
      [data-netlify-drawers],
      iframe[src*="netlify"],
      div[class*="netlify"],
      div[id*="netlify"],
      a[href*="netlify.com"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        transform: translate(-9999px, -9999px) !important;
        position: absolute !important;
        z-index: -99999 !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>

  <body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden overflow-y-auto antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- JavaScript to continuamente purge Netlify DOM elements -->
    <script>
      (function() {
        function killNetlify() {
          const selectors = ['net-lify', 'netlify-drawer', 'netlify-feedback-button', '[data-netlify-drawers]'];
          selectors.forEach(selector => {
            document.querySelectorAll(selector).forEach(el => el.remove());
          });
        }
        
        // Immediate and interval checks
        killNetlify();
        const interval = setInterval(killNetlify, 300);
        setTimeout(() => clearInterval(interval), 10000);

        // Observer for ongoing updates
        const observer = new MutationObserver(killNetlify);
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
