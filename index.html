    <link rel="manifest" href="/manifest.json" />
    <title>RUHUL MIDIA - ভিডিও শেয়ারিং এবং অ্যাপ প্ল্যাটফর্ম</title>
    <meta name="description" content="RUHUL MIDIA হলো একটি আধুনিক ভিডিও শেয়ারিং এবং অ্যাপ প্ল্যাটফর্ম।" />
    <meta property="og:title" content="RUHUL MIDIA - ভিডিও শেয়ারিং এবং অ্যাপ প্ল্যাটফর্ম" />
    <meta property="og:description" content="RUHUL MIDIA হলো একটি আধুনিক ভিডিও শেয়ারিং এবং অ্যাপ প্ল্যাটফর্ম।" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Telegram WebApp SDK for Telegram Bot & Mini App Integration -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      /* Force hide all Netlify Inject Elements */
      net-lify,
      netlify-drawer,
      netlify-feedback-button,
      [data-netlify-drawers],
      iframe[src*="netlify"],
      div[class*="netlify"],
      div[id*="netlify"],
      a[href*="netlify.com"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
        position: absolute !important;
        left: -9999px !important;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden overflow-y-auto antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- JavaScript to automatically remove Netlify Custom Elements -->
    <script>
      const removeNetlifyElements = () => {
        const elements = document.querySelectorAll('net-lify, netlify-drawer, netlify-feedback-button, [data-netlify-drawers]');
        elements.forEach(el => el.remove());
      };
      
      // Run immediately & periodically to remove dynamically inserted popups
      removeNetlifyElements();
      const observer = new MutationObserver(removeNetlifyElements);
      observer.observe(document.documentElement, { childList: true, subtree: true });
    </script>
  </body>
</html>
