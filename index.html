<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <title>RUHUL MIDIA - ভিডিও শেয়ারিং এবং অ্যাপ প্ল্যাটফর্ম</title>
    <meta name="description" content="RUHUL MIDIA হলো একটি আধুনিক ভিডিও শেয়ারিং এবং অ্যাপ প্ল্যাটফর্ম।" />
    <meta property="og:title" content="RUHUL MIDIA - ভিডিও শেয়ারিং এবং অ্যাপ প্ল্যাটফর্ম" />
    <meta property="og:description" content="RUHUL MIDIA হলো একটি আধুনিক ভিডিও শেয়ারিং এবং অ্যাপ প্ল্যাটফর্ম।" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      /* Fix scrolling issues for Mobile & Web */
      html, body {
        height: 100% !important;
        max-height: 100% !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
        touch-action: manipulation;
      }
      #root {
        min-height: 100vh;
        overflow-y: auto !important;
      }

      /* Hide Netlify Elements safely without breaking touch/scroll events */
      net-lify,
      netlify-drawer,
      netlify-feedback-button,
      [data-netlify-drawers],
      iframe[src*="netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: fixed !important;
        top: -9999px !important;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Script to clean Netlify elements from DOM -->
    <script>
      (function() {
        function removeNetlify() {
          const selectors = ['net-lify', 'netlify-drawer', 'netlify-feedback-button', '[data-netlify-drawers]'];
          selectors.forEach(sel => {
            document.querySelectorAll(sel).forEach(el => el.remove());
          });
        }
        removeNetlify();
        const observer = new MutationObserver(removeNetlify);
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
